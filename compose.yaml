services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoward
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: invoward_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoward -d invoward"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
