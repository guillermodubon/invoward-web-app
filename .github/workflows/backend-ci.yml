name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  maven-validation:
    name: Maven validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  docker-build:
    name: Docker image validation
    runs-on: ubuntu-latest
    needs:
      - maven-validation
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --tag invoward-backend:ci .
