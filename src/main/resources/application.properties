spring.application.name=invoward

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.servlet.session.cookie.name=INVOWARD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie

# Local defaults only; remote environments must provide DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/invoward}
spring.datasource.username=${DB_USERNAME:invoward}
spring.datasource.password=${DB_PASSWORD:invoward_local}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=invoward

# PostgreSQL constraint warnings can include sensitive values from failed inserts.
logging.level.org.hibernate.orm.jdbc.error=ERROR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=invoward
spring.flyway.schemas=invoward
spring.flyway.create-schemas=true

invoward.email.provider=${EMAIL_PROVIDER:disabled}
invoward.email.from-name=${EMAIL_FROM_NAME:InvoWard}

invoward.email.gmail.client-id=${GMAIL_CLIENT_ID:}
invoward.email.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
invoward.email.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
invoward.email.gmail.sender-address=${GMAIL_SENDER_ADDRESS:}

invoward.email.gmail.connect-timeout=${GMAIL_CONNECT_TIMEOUT:5s}
invoward.email.gmail.read-timeout=${GMAIL_READ_TIMEOUT:20s}

invoward.identity.registration-verification-token-ttl=${REGISTRATION_VERIFICATION_TOKEN_TTL:24h}
invoward.identity.verification-url=${ACCOUNT_VERIFICATION_URL:http://localhost:3000/verify-email}
invoward.identity.verification-resend-cooldown=${VERIFICATION_RESEND_COOLDOWN:60s}
invoward.identity.password-reset-token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
invoward.identity.password-reset-request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:60s}
invoward.identity.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
invoward.identity.email-change-token-ttl=${EMAIL_CHANGE_TOKEN_TTL:24h}
invoward.identity.email-change-request-cooldown=${EMAIL_CHANGE_REQUEST_COOLDOWN:60s}
invoward.identity.email-change-confirmation-url=${EMAIL_CHANGE_CONFIRMATION_URL:http://localhost:3000/verify-email?flow=email-change}

invoward.guest.session-ttl=${GUEST_SESSION_TTL:24h}
invoward.guest.cookie.secure=${GUEST_COOKIE_SECURE:false}
invoward.guest.cookie.same-site=${GUEST_COOKIE_SAME_SITE:lax}
