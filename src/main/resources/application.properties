spring.application.name=invoward

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Local defaults only; remote environments must provide DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/invoward}
spring.datasource.username=${DB_USERNAME:invoward}
spring.datasource.password=${DB_PASSWORD:invoward_local}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=invoward

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=invoward
spring.flyway.schemas=invoward
spring.flyway.create-schemas=true
