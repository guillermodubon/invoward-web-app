spring.application.name=invoward

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.servlet.session.cookie.name=INVOWARD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie

# Local defaults only; remote environments must provide DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/invoward}
spring.datasource.username=${DB_USERNAME:invoward}
spring.datasource.password=${DB_PASSWORD:invoward_local}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=invoward

# PostgreSQL constraint warnings can include sensitive values from failed inserts.
logging.level.org.hibernate.orm.jdbc.error=ERROR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=invoward
spring.flyway.schemas=invoward
spring.flyway.create-schemas=true

spring.servlet.multipart.max-file-size=${DOCUMENT_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MULTIPART_MAX_REQUEST_SIZE:12MB}
spring.servlet.multipart.file-size-threshold=0B

spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:}
spring.ai.google.genai.chat.temperature=0
spring.ai.google.genai.chat.candidate-count=1
spring.ai.google.genai.chat.google-search-retrieval=false
spring.ai.google.genai.chat.tool-choice.mode=NONE

invoward.ai.extraction.cache-ttl=${AI_EXTRACTION_CACHE_TTL:24h}
invoward.ai.extraction.max-line-items=${AI_EXTRACTION_MAX_LINE_ITEMS:500}
invoward.ai.extraction.max-source-text-code-points=${AI_EXTRACTION_MAX_SOURCE_TEXT_CODE_POINTS:4000}

invoward.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
invoward.documents.max-combined-size=${DOCUMENT_MAX_COMBINED_SIZE:20MB}
invoward.documents.max-pdf-pages=${DOCUMENT_MAX_PDF_PAGES:15}
invoward.documents.max-image-width=${DOCUMENT_MAX_IMAGE_WIDTH:6000}
invoward.documents.max-image-height=${DOCUMENT_MAX_IMAGE_HEIGHT:6000}

invoward.document-storage.provider=${DOCUMENT_STORAGE_PROVIDER:disabled}
invoward.document-storage.r2.account-id=${R2_ACCOUNT_ID:}
invoward.document-storage.r2.bucket=${R2_BUCKET:}
invoward.document-storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
invoward.document-storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
invoward.document-storage.download-url-ttl=${DOCUMENT_DOWNLOAD_URL_TTL:5m}
invoward.document-storage.r2.api-call-timeout=${R2_API_CALL_TIMEOUT:60s}
invoward.document-storage.r2.api-call-attempt-timeout=${R2_API_CALL_ATTEMPT_TIMEOUT:30s}

invoward.email.provider=${EMAIL_PROVIDER:disabled}
invoward.email.from-name=${EMAIL_FROM_NAME:InvoWard}

invoward.email.gmail.client-id=${GMAIL_CLIENT_ID:}
invoward.email.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
invoward.email.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
invoward.email.gmail.sender-address=${GMAIL_SENDER_ADDRESS:}

invoward.email.gmail.connect-timeout=${GMAIL_CONNECT_TIMEOUT:5s}
invoward.email.gmail.read-timeout=${GMAIL_READ_TIMEOUT:20s}

invoward.identity.registration-verification-token-ttl=${REGISTRATION_VERIFICATION_TOKEN_TTL:24h}
invoward.identity.verification-url=${ACCOUNT_VERIFICATION_URL:http://localhost:3000/verify-email}
invoward.identity.verification-resend-cooldown=${VERIFICATION_RESEND_COOLDOWN:60s}
invoward.identity.password-reset-token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
invoward.identity.password-reset-request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:60s}
invoward.identity.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
invoward.identity.email-change-token-ttl=${EMAIL_CHANGE_TOKEN_TTL:24h}
invoward.identity.email-change-request-cooldown=${EMAIL_CHANGE_REQUEST_COOLDOWN:60s}
invoward.identity.email-change-confirmation-url=${EMAIL_CHANGE_CONFIRMATION_URL:http://localhost:3000/verify-email?flow=email-change}

invoward.guest.session-ttl=${GUEST_SESSION_TTL:24h}
invoward.guest.cookie.secure=${GUEST_COOKIE_SECURE:false}
invoward.guest.cookie.same-site=${GUEST_COOKIE_SAME_SITE:lax}
